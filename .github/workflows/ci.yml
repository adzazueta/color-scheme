name: CI

on:
  pull_request:
    # No edited: the title check lives in pr-title.yml, so description edits
    # do not re-run the full CI.
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true
      - run: vp check
      # Type checks src/ alone: test dependencies such as Color.js load the DOM types into the
      # whole program, and src/ must stay free of the DOM.
      - name: Type check src/ without the DOM
        run: vp exec tsc -p tsconfig.src.json

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - name: Test
        if: ${{ !(matrix.node == 24 && matrix.os == 'ubuntu-24.04') }}
        run: vp test --project node
      - name: Test with coverage
        if: ${{ matrix.node == 24 && matrix.os == 'ubuntu-24.04' }}
        run: vp test --project node --coverage
      - name: Coverage summary
        if: ${{ matrix.node == 24 && matrix.os == 'ubuntu-24.04' }}
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const total = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
          const rows = ["lines", "statements", "functions", "branches"].map(
            (key) => `| ${key} | ${total[key].pct}% | ${total[key].covered} / ${total[key].total} |`,
          );
          const markdown = [
            "### Coverage (Node 24, ubuntu-24.04)",
            "",
            "| Metric | Covered | Count |",
            "| --- | --- | --- |",
            ...rows,
            "",
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);

  browser:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true
      - run: vp exec playwright install --with-deps chromium firefox webkit
      - run: vp test --project browser

  pack:
    name: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true
      - run: vp pack
      # Specification 10.1: stable version pull requests need the current algorithm's report.
      # The script exempts prereleases; the branch name is used only in the condition, never a script.
      - name: Require the evaluation report (stable version pull requests)
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && startsWith(github.head_ref, 'changeset-release/')
        run: node scripts/check-report.mjs
      # Specification 6.5: the bundle size is measured and shown in the summary, without a limit.
      - name: Bundle size summary
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const path = require("node:path");
          const zlib = require("node:zlib");
          // Default sort: UTF-16 code unit order, so the rows keep a fixed order.
          const files = fs
            .readdirSync("dist", { recursive: true })
            .map((name) => path.join("dist", name))
            .filter((file) => fs.statSync(file).isFile())
            .sort();
          let totalSize = 0;
          let totalGzip = 0;
          const rows = files.map((file) => {
            const content = fs.readFileSync(file);
            const gzip = zlib.gzipSync(content).length;
            totalSize += content.length;
            totalGzip += gzip;
            return `| ${file} | ${content.length} | ${gzip} |`;
          });
          const markdown = [
            "### Bundle size",
            "",
            "| File | Size (bytes) | Gzip (bytes) |",
            "| --- | --- | --- |",
            ...rows,
            `| Total | ${totalSize} | ${totalGzip} |`,
            "",
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
      # Specification 6.4 and 10.1: benchmark times of the built package in the summary, as
      # information only and without a limit, because shared runners are too noisy to compare times.
      # Slow times never fail the job; an error, such as a seed that throws, does.
      - name: Benchmarks
        run: >-
          vp test bench --project "node (bench)" --reporter verbose --reporter json
          --outputFile.json="$RUNNER_TEMP/bench.json"
      - name: Benchmark summary
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const report = JSON.parse(
            fs.readFileSync(path.join(process.env.RUNNER_TEMP, "bench.json"), "utf8"),
          );
          const ms = (value) => value.toFixed(3);
          const cell = (text) => String(text).replace(/\|/g, "\\|");
          const rows = [];
          for (const file of report.testResults) {
            for (const test of file.assertionResults) {
              // A sample of the whole set computes every seed; its times are divided by their number.
              const schemes = test.meta?.schemesPerSample ?? 1;
              for (const benchmark of test.benchmarks ?? []) {
                for (const task of benchmark.tasks) {
                  const { mean, p99, max, samplesCount } = task.latency;
                  rows.push(
                    `| ${cell(test.title)} | ${cell(task.name)} | ${ms(mean / schemes)} | ${ms(p99 / schemes)} | ${ms(max / schemes)} | ${samplesCount} |`,
                  );
                }
              }
            }
          }
          if (rows.length === 0) throw new Error("The benchmark report has no results.");
          const cpus = os.cpus();
          const markdown = [
            "### Benchmarks",
            "",
            "Milliseconds per scheme, as information only: shared runners are too noisy to compare times.",
            "Each sample of the whole set computes every seed, so its times are divided by their number.",
            "",
            "| Case | Seeds | Mean (ms) | p99 (ms) | Max (ms) | Samples |",
            "| --- | --- | --- | --- | --- | --- |",
            ...rows,
            "",
            `${cpus[0]?.model ?? "Unknown CPU"} (${cpus.length} cores), ${os.platform()} ${os.release()} (${os.arch()}), Node ${process.version}.`,
            "",
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
      - name: Create the tarball
        run: |
          mkdir -p "$RUNNER_TEMP/tarball"
          vp pm pack --pack-destination "$RUNNER_TEMP/tarball"
          if [ "$(find "$RUNNER_TEMP/tarball" -maxdepth 1 -type f -name '*.tgz' | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly one tarball."
            ls -l "$RUNNER_TEMP/tarball"
            exit 1
          fi
      # Specification 10.1: the smoke test runs on exactly Node.js 22.12.0. These steps come last:
      # setup-node puts Node.js 22.12.0 first on the PATH, and the benchmarks and their summary above
      # must run on Node.js 24 from setup-vp.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Smoke test on Node.js 22.12.0
        env:
          SMOKE_EXPECTED_NODE: 22.12.0
        run: node scripts/smoke.mjs "$RUNNER_TEMP"/tarball/*.tgz

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          advanced-security: false

  changeset:
    name: changeset
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && !(github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'changeset-release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true
      - name: Require a changeset when src/ or package.json changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: vp exec changeset status --since="origin/$BASE_REF"
